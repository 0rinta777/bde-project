name: CI

# Run this workflow every time a pull request into develop or main is opened or updated
on:
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from the repo
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install Node.js (same major version as on my computer)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install the exact package versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Type-check with tsc and build with Vite
      - name: Build
        run: npm run build

      # 5. Run the Vitest unit tests
      - name: Run tests
        run: npm test
