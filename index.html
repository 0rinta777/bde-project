<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bde-project-main</title>
  </head>
  <body>
    <div id="app"></div>
        <div class="container">
          <h1>Todo app</h1>
          <form class="todo-form">
            <input type="text" placeholder="Add a new todo item" id="todo-input">
            <select id="priority-select">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
            <button type="submit">Add</button>
          </form>
        <p id="error-message">Please enter a todo item.</p>

        <input type="text" id="search-input" placeholder="Search todos...">

        <button type="button" id="sort-button">Sort by priority</button>
        <button type="button" id="clear-button">Clear all</button>

      <ul class="todo-list" id="todo-list">

</ul>

<input type="color" id="colorPicker" />

</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
